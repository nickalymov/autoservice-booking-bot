services:
  postgres:
    image: postgres:16-alpine
    container_name: autoservice_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: autoservice_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autoservice_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: autoservice_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./app:/app/app

volumes:
  postgres_data:
